<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add Cards – Shany</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f8f5;--fg:#1d2b27;--mut:#5b6b66;--line:#9db3ab;--acc:#0f766e;--bl:#fff3c4;--card:#fff;--ok:#15803d;--no:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201d;--fg:#e6eeeb;--mut:#9fb2ac;--line:#3f5a52;--acc:#5eead4;--bl:#3d3a14;--card:#1b2b27;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#14201d;--fg:#e6eeeb;--mut:#9fb2ac;--line:#3f5a52;--acc:#5eead4;--bl:#3d3a14;--card:#1b2b27;--ok:#4ade80;--no:#f87171}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font:1.6rem Georgia,serif;margin:0}
h2{font:1.1rem Georgia,serif;margin:0 0 12px; color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap; margin-bottom:24px; padding-bottom:16px; border-bottom:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
button,select,input,textarea{font:inherit;padding:10px 14px;border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px; transition:border-color 0.2s}
input:focus, textarea:focus { border-color:var(--acc); outline:none; }
button{border-width:1px; border-color:var(--line); background:var(--card); cursor:pointer; font-weight:600;}
button:hover { background:color-mix(in srgb, var(--acc) 5%, var(--card)); }
button.primary{background:var(--acc);color:var(--bg); border-color:var(--acc);}
button.primary:hover{filter:brightness(1.1)}
button.danger{border-color:var(--no);color:var(--no); background:color-mix(in srgb, var(--no) 5%, var(--card))}
button.sm{padding:4px 12px;font-size:.85rem}
input[type=radio]{width:auto;padding:0}
textarea{width:100%;min-height:130px;resize:vertical;font-size:1.05rem; font-family:Georgia,serif;}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin:20px 0; box-shadow:0 8px 24px rgba(0,0,0,.03)}
.mut{color:var(--mut);font-size:.85rem}
.msg{min-height:1.3em;font-weight:600;margin-top:10px}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.hidden{display:none !important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--mut); font-weight:600;}
label.f input{color:var(--fg)}
#words{font:1.3rem/2.4 Georgia,serif;padding:20px;border:2px dashed var(--line);border-radius:12px;background:var(--bg)}
.w{cursor:pointer;padding:3px 4px;border-radius:5px;border:1px solid transparent;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.w:hover{border-color:var(--acc)}
.w.sel{background:var(--bl);border-bottom:2px solid var(--fg);font-weight:700}
.pv{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:1.1rem/1.8 Georgia,serif;margin:8px 0}
.pv.b{border-color:var(--acc); background:color-mix(in srgb, var(--acc) 3%, var(--bg))}
.pv small{display:block;font:.75rem system-ui,sans-serif;color:var(--mut);margin-bottom:6px; font-weight:700; text-transform:uppercase;}
.bl{display:inline-block;min-width:4em;font-weight:700;outline:2px solid var(--acc);border-bottom:2px solid var(--fg);background:var(--bl);text-align:center;color:var(--mut)}
mark{font:inherit;font-weight:700;background:var(--bl);color:var(--fg);padding:0 4px;border-radius:4px}
.q{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
.q .pv{flex:1;margin:0;font-size:1rem; padding:12px;}
</style></head><body><main>
  
<div class="top">
  <div style="display:flex;align-items:center;gap:10px;">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:34px;height:34px">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient></defs>
      <rect x="10" y="14" width="36" height="44" rx="6" fill="url(#g1)" opacity=".25"/>
      <rect x="16" y="8" width="36" height="44" rx="6" fill="url(#g1)"/>
      <path d="M24 22h20M24 30h20M24 38h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="46" cy="46" r="10" fill="#fff" stroke="url(#g1)" stroke-width="3"/>
      <path d="M42 46l3 3 6-6" stroke="url(#g1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Add Cards Tool</h1>
  </div>
  <button onclick="location.href='admin.html'">← Back to Admin</button>
</div>

<div id="gate" class="box"><div id="gateMsg">Checking access...</div></div>

<div id="app" class="hidden">

  <div class="box">
    <h2>1. Destination Deck</h2>
    <div class="grid">
      <label class="f">Deck name (select or create new)
        <input type="text" id="cat" list="catList" autocomplete="off" placeholder="e.g. Biology 101">
        <datalist id="catList"></datalist>
      </label>
      <label class="f">Crumb / Heading (optional)
        <input type="text" id="crumb" autocomplete="off" placeholder="e.g. Chapter 3 › Anatomy">
      </label>
    </div>
    <div class="mut" id="catInfo" style="margin-top:8px;"></div>
  </div>

  <div class="box">
    <h2>2. Paste Full Sentence</h2>
    <textarea id="src" dir="auto" placeholder="Paste the exact text from the book here..."></textarea>
    <div class="row" style="justify-content:flex-end;"><button class="primary" id="parse" style="padding:12px 24px;">Prepare Text ↓</button></div>
  </div>

  <div class="box hidden" id="step3">
    <h2>3. Select Blanks (Cloze)</h2>
    <div class="mut" style="margin-bottom:12px;">Click words to hide them. Adjacent selected words merge into one blank.</div>
    <div id="words" dir="auto"></div>

    <div class="row" style="margin:20px 0; background:var(--bg); padding:12px; border-radius:8px; border:1px solid var(--line);">
      <label style="font-weight:600; cursor:pointer;"><input type="radio" name="mode" value="one" checked> Single card (all blanks together)</label>
      <span style="color:var(--line)">|</span>
      <label style="font-weight:600; cursor:pointer;"><input type="radio" name="mode" value="each"> Separate card per blank</label>
    </div>

    <div class="mut" style="font-weight:700;">Live Preview:</div>
    <div id="preview"></div>

    <div class="row" style="margin-top:20px;">
      <button class="primary" id="stage" style="flex:1; padding:12px;">Add to Queue ＋</button>
      <button id="clearSel" style="padding:12px;">Clear selection</button>
    </div>
    <div class="msg" id="stageMsg"></div>
  </div>

  <div class="box hidden" id="queueBox" style="border-color:var(--acc);">
    <h2 style="color:var(--acc)">Ready to Save (<span id="qCount">0</span>)</h2>
    <div id="queue" style="max-height:400px; overflow-y:auto; margin-bottom:16px;"></div>
    <div class="row">
      <button class="primary" id="save" style="flex:1; padding:14px; font-size:1.1rem;">💾 Save all to Database</button>
      <button class="danger" id="qClear" style="padding:14px;">Clear Queue</button>
    </div>
  </div>
  <div class="msg" id="saveMsg"></div>

</div>

<script>
// (The JS logic is completely identical to your original add-cards script)
const SUPABASE_URL = "https://rphakvxxjnzzwxzghcld.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KrRdYi553EtaX_ggzzVHeQ_L_gb6xFf";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var $ = function(i){ return document.getElementById(i); };

var CATS = [], TEXT = '', WORDS = [], QUEUE = [];
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setMsg(id, text, kind){ var m = $(id); m.className = 'msg ' + (kind || ''); m.textContent = text || ''; }

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('gateMsg').innerHTML = 'Please log in first.'; return; }
  const { data: ok, error } = await sb.rpc('is_admin');
  if (error || ok !== true) { $('gateMsg').textContent = 'Not an admin.'; return; }
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  await loadCats();
}
window.addEventListener('DOMContentLoaded', init);

async function loadCats(){
  const { data } = await sb.from('categories').select('name').order('name');
  CATS = data || [];
  $('catList').innerHTML = CATS.map(c => '<option value="' + esc(c.name).replace(/"/g,'&quot;') + '">').join('');
}
$('cat').oninput = function(){
  var n = $('cat').value.trim();
  $('catInfo').textContent = !n ? '' : CATS.some(c => c.name === n) ? '✓ Existing deck' : 'New deck will be created automatically.';
};

function parse(){
  TEXT = $('src').value.replace(/\r/g,'').trim(); WORDS = [];
  if (!TEXT) { $('step3').classList.add('hidden'); return; }
  var re = /[\p{L}\p{N}_]+(?:[-'’\/.][\p{L}\p{N}_]+)*/gu, m;
  while ((m = re.exec(TEXT))) WORDS.push({ s: m.index, e: m.index + m[0].length, sel: false });
  $('step3').classList.remove('hidden'); drawWords();
}
$('parse').onclick = parse;

function drawWords(){
  var html = '', last = 0;
  WORDS.forEach((w, i) => {
    html += esc(TEXT.slice(last, w.s)).replace(/\n/g,'<br>');
    html += '<span class="w' + (w.sel ? ' sel' : '') + '" data-i="' + i + '">' + esc(TEXT.slice(w.s, w.e)) + '</span>';
    last = w.e;
  });
  html += esc(TEXT.slice(last)).replace(/\n/g,'<br>');
  $('words').innerHTML = html; drawPreview();
}
$('words').onclick = function(e){
  var t = e.target.closest('.w'); if (!t) return;
  var w = WORDS[+t.dataset.i]; w.sel = !w.sel; t.classList.toggle('sel', w.sel); drawPreview();
};
$('clearSel').onclick = function(){ WORDS.forEach(w => w.sel = false); drawWords(); };

function groups(){
  var g = [], cur = null;
  WORDS.forEach(w => {
    if (!w.sel) { cur = null; return; }
    if (cur && /^[ \t]*$/.test(TEXT.slice(cur.e, w.s))) cur.e = w.e; else { cur = { s: w.s, e: w.e }; g.push(cur); }
  }); return g;
}
function cardFor(gs, active){
  var q = '', a = '', last = 0;
  gs.forEach((g, i) => {
    var b = esc(TEXT.slice(last, g.s)), w = esc(TEXT.slice(g.s, g.e));
    q += b; a += b;
    if (active.includes(i)) { q += '<span class="bl">&nbsp;</span>'; a += '<mark>' + w + '</mark>'; } else { q += w; a += w; }
    last = g.e;
  });
  var t = esc(TEXT.slice(last)); return { q: (q + t).replace(/\n/g,'<br>'), a: (a + t).replace(/\n/g,'<br>') };
}
function buildCards(){
  var gs = groups(), out = []; if (!gs.length) return out;
  var mode = document.querySelector('input[name=mode]:checked').value;
  if (mode === 'each') gs.forEach((_, i) => out.push(cardFor(gs, [i]))); else out.push(cardFor(gs, gs.map((_, i) => i)));
  return out;
}
function drawPreview(){
  var cards = buildCards(), box = $('preview');
  if (!cards.length) { box.innerHTML = '<div class="mut">Select words above to see preview.</div>'; return; }
  box.innerHTML = cards.map((c, i) => '<div class="pv" dir="auto"><small>Question</small>' + c.q + '</div><div class="pv b" dir="auto"><small>Answer</small>' + c.a + '</div>').join('');
}
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = drawPreview);

$('stage').onclick = function(){
  var cards = buildCards(); if (!cards.length) { setMsg('stageMsg', 'Select words first.', 'no'); return; }
  cards.forEach(c => QUEUE.push(c)); setMsg('stageMsg', 'Added to queue ✓', 'ok');
  $('src').value = ''; TEXT = ''; WORDS = []; $('step3').classList.add('hidden'); drawQueue();
};
function drawQueue(){
  $('queueBox').classList.toggle('hidden', !QUEUE.length); $('qCount').textContent = QUEUE.length;
  $('queue').innerHTML = '';
  QUEUE.forEach((c, i) => {
    var d = document.createElement('div'); d.className = 'q';
    var pv = document.createElement('div'); pv.className = 'pv'; pv.innerHTML = c.q;
    var del = document.createElement('button'); del.className = 'sm danger'; del.textContent = 'Remove';
    del.onclick = () => { QUEUE.splice(i, 1); drawQueue(); };
    d.appendChild(pv); d.appendChild(del); $('queue').appendChild(d);
  });
}
$('qClear').onclick = () => { if (QUEUE.length && confirm('Clear the queue?')) { QUEUE = []; drawQueue(); } };

$('save').onclick = async function(){
  var cat = $('cat').value.trim(), crumb = $('crumb').value.trim();
  if (!cat) { setMsg('saveMsg', 'Enter a deck name first.', 'no'); return; }
  $('save').disabled = true; setMsg('saveMsg', 'Saving...');
  
  if (!CATS.some(c => c.name === cat)) await sb.from('categories').insert({ name: cat, is_free: false, sort_order: 99 });
  var r1 = await sb.from('flashcards').select('card_order').eq('category', cat).order('card_order', { ascending: false }).limit(1);
  var start = (r1.data && r1.data.length && r1.data[0].card_order != null) ? r1.data[0].card_order : 0;
  
  var rows = QUEUE.map((c, i) => ({ category: cat, question: c.q, answer: c.a, crumb: crumb || null, card_order: start + i + 1 }));
  var r2 = await sb.from('flashcards').insert(rows);
  
  $('save').disabled = false;
  if (r2.error) { setMsg('saveMsg', r2.error.message, 'no'); return; }
  QUEUE = []; drawQueue(); setMsg('saveMsg', rows.length + ' card(s) saved ✓', 'ok'); loadCats();
};
</script></main></body></html>
