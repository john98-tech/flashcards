<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>منصة الفلاش كاردس التعليمية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#f7f8f5;--fg:#1d2b27;--mut:#5b6b66;--line:#9db3ab;--acc:#0f766e;--bl:#fff3c4;--card:#fff;--ok:#15803d;--no:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201d;--fg:#e6eeeb;--mut:#9fb2ac;--line:#3f5a52;--acc:#5eead4;--bl:#3d3a14;--card:#1b2b27;--ok:#4ade80;--no:#f87171}}
        :root[data-theme="dark"]{--bg:#14201d;--fg:#e6eeeb;--mut:#9fb2ac;--line:#3f5a52;--acc:#5eead4;--bl:#3d3a14;--card:#1b2b27;--ok:#4ade80;--no:#f87171}
        html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
        main{width:100%;max-width:420px;padding:20px}
        
        .logo-container{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px}
        .logo-container svg{width:48px;height:48px}
        .logo-text{font:700 2rem Georgia,serif;background:linear-gradient(135deg,#0f766e,#0ea5e9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        
        h1{font-size:1.3rem;margin:0;text-align:center;font-family:Georgia,serif}
        .sub{font-size:.9rem;color:var(--mut);text-align:center;margin:4px 0 24px}

        .box{padding:28px;background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:0 10px 30px -10px rgba(0,0,0,0.1)}
        .row{display:flex;gap:8px;margin:0 0 20px}
        button,input{font:inherit;transition:all 0.2s}
        .row button{flex:1;padding:10px;border:1px solid var(--acc);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer;font-weight:600}
        .row button.active{background:var(--acc);color:var(--bg);box-shadow:0 4px 12px color-mix(in srgb, var(--acc) 30%, transparent)}
        .row button:not(.active):hover{background:color-mix(in srgb, var(--acc) 10%, var(--bg))}

        .auth-tab{animation: fadeIn 0.3s ease}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:6px;font-weight:500}
        .form-group{margin-bottom:16px}
        input{width:100%;padding:10px 14px;border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font-size:1rem;outline:none}
        input:focus{border-color:var(--acc);background:var(--card)}
        .btn-main{width:100%;margin-top:10px;padding:12px;border:none;background:var(--acc);color:var(--bg);font-weight:700;border-radius:8px;cursor:pointer;font-size:1rem;box-shadow:0 4px 12px color-mix(in srgb, var(--acc) 40%, transparent)}
        .btn-main:hover{filter:brightness(1.1);transform:translateY(-1px)}
        .btn-main:disabled{opacity:.6;cursor:wait;transform:none}

        .hidden{display:none !important}
        #status-message{font-size:.9rem;text-align:center;margin-top:16px;min-height:1.2em;border-radius:6px;padding:8px}
        .error-msg{background:color-mix(in srgb, var(--no) 15%, transparent);color:var(--no);font-weight:600}
        .success-msg{background:color-mix(in srgb, var(--ok) 15%, transparent);color:var(--ok);font-weight:600}
        .info-msg{color:var(--mut)}
    </style>
</head>
<body>
<main>
    <div class="logo-container">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient></defs>
            <rect x="10" y="14" width="36" height="44" rx="6" fill="url(#lg)" opacity=".25"/>
            <rect x="16" y="8" width="36" height="44" rx="6" fill="url(#lg)"/>
            <path d="M24 22h20M24 30h20M24 38h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <circle cx="46" cy="46" r="10" fill="#fff" stroke="url(#lg)" stroke-width="3"/>
            <path d="M42 46l3 3 6-6" stroke="url(#lg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">Shany</span>
    </div>
    <h1>منصة الفلاش كاردس</h1>
    <p class="sub" id="subtitle-text">سجل دخولك للوصول إلى حسابك</p>

    <div class="box">
        <div class="row">
            <button class="active" id="btn-login" onclick="switchTab('login')">تسجيل الدخول</button>
            <button id="btn-signup" onclick="switchTab('signup')">حساب جديد</button>
        </div>

        <div id="tab-login" class="auth-tab">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="login-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="btn-main" id="login-submit" onclick="loginWithEmail()">دخول للمنصة</button>
        </div>

        <div id="tab-signup" class="auth-tab hidden">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="signup-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="signup-password" placeholder="•••••••• (6 أحرف على الأقل)">
            </div>
            <button class="btn-main" id="signup-submit" onclick="signUpWithEmail()">إنشاء الحساب</button>
        </div>

        <div id="status-message"></div>
    </div>
</main>

<script>
    const SUPABASE_URL = "https://rphakvxxjnzzwxzghcld.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KrRdYi553EtaX_ggzzVHeQ_L_gb6xFf";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(tabName) {
        document.querySelectorAll('.row button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.add('hidden'));
        document.getElementById('status-message').className = '';
        document.getElementById('status-message').innerText = '';
        document.getElementById('btn-' + tabName).classList.add('active');
        document.getElementById('tab-' + tabName).classList.remove('hidden');
        document.getElementById('subtitle-text').innerText =
            tabName === 'login' ? 'سجل دخولك للوصول إلى حسابك' : 'أنشئ حساباً جديداً وابدأ الآن';
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;
        const localToken = localStorage.getItem('session_token');
        if (localToken) {
            const { data } = await supabaseClient.from('active_sessions').select('session_token').eq('user_id', session.user.id).maybeSingle();
            if (data && data.session_token === localToken) {
                window.location.href = 'flashcards.html';
                return;
            }
        }
        await supabaseClient.auth.signOut();
        localStorage.removeItem('session_token');
    });

    async function registerSession(userId) {
        const token = Math.random().toString(36).substring(2) + Date.now().toString(36);
        const { error } = await supabaseClient.from('active_sessions').upsert(
            { user_id: userId, session_token: token, updated_at: new Date().toISOString() },
            { onConflict: 'user_id' }
        );
        if (error) throw error;
        localStorage.setItem('session_token', token);
    }

    async function loginWithEmail() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        if (!email || !password) { showError('يرجى إدخال البريد وكلمة المرور!'); return; }
        const btn = document.getElementById('login-submit');
        btn.disabled = true;
        showMsg('جاري تسجيل الدخول...', false);
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            btn.disabled = false;
            showError('خطأ في البريد أو كلمة المرور: ' + error.message);
            return;
        }
        try { await registerSession(data.user.id); } catch (e) { await supabaseClient.auth.signOut(); btn.disabled = false; showError('تعذر تسجيل الجلسة: ' + e.message); return; }
        showMsg('تم الدخول بنجاح! جاري التوجيه...', true);
        setTimeout(() => window.location.href = 'flashcards.html', 600);
    }

    async function signUpWithEmail() {
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        if (!email || password.length < 6) { showError('يرجى إدخال إيميل صحيح وباسورد لا يقل عن 6 أحرف!'); return; }
        const btn = document.getElementById('signup-submit');
        btn.disabled = true;
        showMsg('جاري إنشاء الحساب...', false);
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) { btn.disabled = false; showError('فشل إنشاء الحساب: ' + error.message); return; }
        if (!data.session) { btn.disabled = false; showMsg('تم إنشاء الحساب! راجع بريدك لتأكيد الإيميل ثم سجّل الدخول.', true); return; }
        try { await registerSession(data.user.id); } catch (e) { await supabaseClient.auth.signOut(); btn.disabled = false; showError('تعذر تسجيل الجلسة: ' + e.message); return; }
        showMsg('تم إنشاء الحساب بنجاح! جاري التوجيه...', true);
        setTimeout(() => window.location.href = 'flashcards.html', 800);
    }

    function showError(msg) { const m = document.getElementById('status-message'); m.className = 'error-msg'; m.innerText = msg; }
    function showMsg(msg, isSuccess) { const m = document.getElementById('status-message'); m.className = isSuccess ? 'success-msg' : 'info-msg'; m.innerText = msg; }
    document.addEventListener('keydown', (e) => { if (e.key !== 'Enter') return; if (!document.getElementById('tab-login').classList.contains('hidden')) loginWithEmail(); else signUpWithEmail(); });
</script>
</body>
</html>
