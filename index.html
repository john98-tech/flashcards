<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفلاش كاردس التعليمية</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f766e, #14201d, #3b82f6);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-shapes div {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 12s infinite alternate ease-in-out;
            z-index: 1;
        }
        .bg-shapes div:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 10%; animation-duration: 8s; }
        .bg-shapes div:nth-child(2) { width: 200px; height: 200px; bottom: 15%; right: 10%; animation-duration: 14s; }
        .bg-shapes div:nth-child(3) { width: 80px; height: 80px; top: 50%; right: 20%; animation-duration: 10s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-40px) rotate(360deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 440px;
            text-align: center;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { color: #1d2b27; margin-bottom: 8px; font-size: 1.6rem; }
        p.subtitle { color: #5b6b66; font-size: 0.9rem; margin-bottom: 25px; }

        .tabs {
            display: flex;
            justify-content: space-between;
            background: #e2e8f0;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #5b6b66;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #0f766e;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label { display: block; font-size: 0.85rem; color: #1d2b27; margin-bottom: 5px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            background: #fff;
        }
        input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15); }

        .btn-main {
            background: #0f766e;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 5px;
        }
        .btn-main:hover { background: #115e59; transform: translateY(-1px); }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #cbd5e1;
        }
        .divider::before { margin-left: 10px; }
        .divider::after { margin-right: 10px; }

        .btn-google {
            background: #ffffff;
            color: #334155;
            border: 2px solid #cbd5e1;
            padding: 11px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-google:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-google img { width: 20px; height: 20px; }

        .hidden { display: none !important; }
        .error-msg { color: #dc2626; font-size: 0.85rem; font-weight: bold; margin-top: 10px; }
        .success-msg { color: #16a34a; font-size: 0.85rem; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <div class="container">
        <h2>منصة الفلاش كاردس</h2>
        <p class="subtitle" id="subtitle-text">سجل دخولك أو أنشئ حساباً للمتابعة</p>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" onclick="switchTab('signup')">حساب جديد</button>
        </div>

        <!-- قسم 1: تسجيل الدخول -->
        <div id="tab-login" class="auth-tab">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="login-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="btn-main" onclick="loginWithEmail()">دخول للمنصة</button>
            
            <div class="divider">أو</div>
            <button class="btn-google" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                الدخول باستخدام جوجل
            </button>
        </div>

        <!-- قسم 2: إنشاء حساب جديد -->
        <div id="tab-signup" class="auth-tab hidden">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="signup-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="signup-password" placeholder="•••••••• (6 أحرف على الأقل)">
            </div>
            <button class="btn-main" onclick="signUpWithEmail()">إنشاء الحساب</button>

            <div class="divider">أو</div>
            <button class="btn-google" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                التسجيل باستخدام جوجل
            </button>
        </div>

        <div id="status-message"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://rphakvxxjnzzwxzghcld.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_KrRdYi553EtaX_ggzzVHeQ_L_gb6xFf";

        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.add('hidden'));
            document.getElementById('status-message').innerText = '';

            if (tabName === 'login') {
                event.target.classList.add('active');
                document.getElementById('tab-login').classList.remove('hidden');
                document.getElementById('subtitle-text').innerText = 'سجل دخولك للوصول إلى حسابك';
            } else if (tabName === 'signup') {
                event.target.classList.add('active');
                document.getElementById('tab-signup').classList.remove('hidden');
                document.getElementById('subtitle-text').innerText = 'أنشئ حساباً جديداً وابدأ الآن';
            }
        }

        // فحص هل المستخدم مسجل دخول بالفعل عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'flashcards.html';
            }
        });

        // إنشاء جلسة جديدة فريدة لمنع الجلسات المتعددة
        async function registerSession(userId) {
            const token = Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('session_token', token);
            await supabaseClient.from('active_sessions').upsert({
                user_id: userId,
                session_token: token,
                updated_at: new Date().toISOString()
            });
        }

        async function loginWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/flashcards.html'
                }
            });
            if (error) {
                showError('فشل تسجيل الدخول بجوجل: ' + error.message);
            }
        }

        async function loginWithEmail() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            showMsg('جاري تسجيل الدخول...', false);

            if (!email || !password) {
                showError('يرجى إدخال البريد وكلمة المرور!');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                showError('خطأ في البريد أو كلمة المرور: ' + error.message);
            } else {
                await registerSession(data.user.id);
                showMsg('تم الدخول بنجاح! جاري التوجيه...', true);
                setTimeout(() => window.location.href = 'flashcards.html', 800);
            }
        }

        async function signUpWithEmail() {
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            showMsg('جاري إنشاء الحساب...', false);

            if (!email || password.length < 6) {
                showError('يرجى إدخال إيميل صحيح وباسورد لا يقل عن 6 أحرف!');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                showError('فشل إنشاء الحساب: ' + error.message);
            } else {
                if (data.user) await registerSession(data.user.id);
                showMsg('تم إنشاء الحساب بنجاح! جاري التوجيه...', true);
                setTimeout(() => window.location.href = 'flashcards.html', 1000);
            }
        }

        function showError(msg) {
            const m = document.getElementById('status-message');
            m.className = 'error-msg';
            m.innerText = msg;
        }

        function showMsg(msg, isSuccess) {
            const m = document.getElementById('status-message');
            m.className = isSuccess ? 'success-msg' : '';
            m.innerText = msg;
        }
    </script>
</body>
</html>
