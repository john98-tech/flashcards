<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Cards – Dynamic Supabase</title>

<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--bg:#f7f8f5;--fg:#1d2b27;--mut:#5b6b66;--line:#9db3ab;--acc:#0f766e;--bl:#fff3c4;--card:#fff;--ok:#15803d;--no:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201d;--fg:#e6eeeb;--mut:#9fb2ac;--line:#3f5a52;--acc:#5eead4;--bl:#3d3a14;--card:#1b2b27;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#14201d;--fg:#e6eeeb;--mut:#9fb2ac;--line:#3f5a52;--acc:#5eead4;--bl:#3d3a14;--card:#1b2b27;--ok:#4ade80;--no:#f87171}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body, html, * {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 Georgia,serif}
main{max-width:640px;margin:0 auto;padding:16px}

.top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-family: system-ui, sans-serif; }
h1{font-size:1.4rem;margin:0}
.btn-logout { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
.btn-logout:hover { background: #dc2626; }

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem;margin:6px 0}
select,button{font:inherit;padding:7px 12px;border:1px solid var(--acc);background:var(--card);color:var(--fg);border-radius:6px}
button{cursor:pointer}
select{max-width:100%}
.card{min-height:260px;margin:14px 0;padding:22px;background:var(--card);border:2px solid var(--line);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.card.back{border-color:var(--acc)}
.tag{font:.75rem system-ui,sans-serif;color:var(--mut);margin-bottom:8px}
.crumb{font:.85rem system-ui,sans-serif;color:var(--mut);margin-bottom:10px}
.txt{font-size:1.25rem}
.hint{font:.8rem system-ui,sans-serif;color:var(--mut);margin-top:12px}
.ctl{display:flex;gap:8px;justify-content:space-between;font-family:system-ui,sans-serif}
.ctl button{flex:1}
.ok{border-color:var(--ok);color:var(--ok)}.no{border-color:var(--no);color:var(--no)}
.stat{font:.9rem system-ui,sans-serif;color:var(--mut);text-align:center;margin-top:10px}
</style>
</head>
<body>
<main>
    <div class="top-header">
        <h1>Flash Cards</h1>
        <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="row">
        <select id="deck"></select>
        <label><input type="checkbox" id="shuf"> Shuffle</label>
        <button id="all">All cards</button>
        <button id="miss">Review missed</button>
    </div>

    <div class="card" id="card"><div class="txt">Loading protected content...</div></div>
    
    <div class="ctl">
        <button id="prev">← Prev</button>
        <button id="flip">Flip</button>
        <button id="next">Next →</button>
    </div>
    
    <div class="ctl" style="margin-top:8px">
        <button class="no" id="bad">✗ Again</button>
        <button class="ok" id="good">✓ Got it</button>
    </div>
    
    <div class="stat" id="stat"></div>
    <p class="hint" style="text-align:center">Keys: Space/Enter = flip, ←/→ = Prev/Next, ↑ = Got it, ↓ = Again.</p>
</main>

<script>
const SUPABASE_URL = "https://rphakvxxjnzzwxzghcld.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KrRdYi553EtaX_ggzzVHeQ_L_gb6xFf";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var D = [];
var st = [], di = 0, list = [], pos = 0, back = false, isMissedMode = false;
var currentUser = null;
var $ = function(i){return document.getElementById(i)}, sel = $('deck');

// 1. التحقق من جلسة Supabase والجلسة الواحدة عند فتح الصفحة
window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    
    if (!session) {
        window.location.href = 'index.html';
        return;
    }
    
    currentUser = session.user;

    // فحص الجلسة الواحدة لمنع التداخل من جهاز آخر
    const localToken = localStorage.getItem('session_token');
    const { data: sessionData } = await supabaseClient
        .from('active_sessions')
        .select('session_token')
        .eq('user_id', currentUser.id)
        .single();

    if (sessionData && sessionData.session_token !== localToken) {
        alert("تم تسجيل الدخول بحسابك من جهاز آخر!");
        await supabaseClient.auth.signOut();
        localStorage.removeItem('session_token');
        window.location.href = 'index.html';
        return;
    }

    await fetchCardsFromSupabase();
});

// 2. جلب الأسئلة من Supabase مرتبة حسب الترتيب الصحيح
async function fetchCardsFromSupabase() {
    let allData = [];
    let step = 1000;
    let from = 0;
    let to = 999;
    let keepFetching = true;

    while (keepFetching) {
        const { data, error } = await supabaseClient
            .from('flashcards')
            .select('*')
            .order('card_order', { ascending: true })
            .range(from, to);

        if (error) {
            console.error("Error fetching data:", error);
            break;
        }

        if (data && data.length > 0) {
            allData = allData.concat(data);
            if (data.length < step) {
                keepFetching = false; 
            } else {
                from += step;
                to += step;
            }
        } else {
            keepFetching = false;
        }
    }

    if (allData.length === 0) {
        $('card').innerHTML = '<div class="txt">No cards available in database yet.</div>';
        return;
    }

    var decksMap = {};
    allData.forEach(item => {
        var categoryName = item.category || 'General';
        if (!decksMap[categoryName]) {
            decksMap[categoryName] = [];
        }
        decksMap[categoryName].push({
            f: item.question,
            b: item.answer,
            s: categoryName,
            c: item.crumb || ''
        });
    });

    D = [];
    for (var cat in decksMap) {
        D.push({
            n: cat,
            cards: decksMap[cat]
        });
    }

    initDeckSystem();
}

function initDeckSystem() {
    sel.innerHTML = '';
    st = D.map(function(d){
        return new Array(d.cards.length).fill(null);
    });
    
    D.forEach(function(d,i){
        var o = document.createElement('option');
        o.value = i;
        o.textContent = d.n + ' (' + d.cards.length + ')';
        sel.appendChild(o);
    });

    di = 0;
    start(false);
}

function start(missed){
    isMissedMode = missed;
    if (!D.length) return;
    var n = D[di].cards.length, idx = [];
    
    for(var i = 0; i < n; i++){
        if(!missed || st[di][i] === 'no') {
            idx.push(i);
        }
    }
    
    if($('shuf').checked && !missed) {
        idx.sort(function(){return Math.random() - .5});
    }
    
    list = idx;
    pos = 0;
    back = false;
    render();
}

function stat(){
    if (!D.length) return;
    var deckStates = st[di];
    var ok = 0, no = 0;
    
    for(var i = 0; i < deckStates.length; i++){
        if(deckStates[i] === 'ok') ok++;
        else if(deckStates[i] === 'no') no++;
    }
    $('stat').textContent = '✓ ' + ok + '    ✗ ' + no;
}

function render(){
    var c = $('card');
    if(!list.length){
        c.className = 'card';
        c.innerHTML = isMissedMode ? '<div class="txt">Great job! No missed cards here.</div>' : '<div class="txt">No cards here yet.</div>';
        stat();
        return;
    }
    var x = D[di].cards[list[pos]];
    c.className = 'card' + (back ? ' back' : '');
    c.innerHTML = '<div class="tag">' + x.s + ' · ' + (pos + 1) + ' / ' + list.length + '</div>' + (x.crumb ? '<div class="crumb">' + x.crumb.replace(/</g,'&lt;') + '</div>' : '') + '<div class="txt">' + (back ? x.b : x.f) + '</div><div class="hint"' + (back ? ' style="visibility:hidden"' : '') + '>Press ✓ Got it or ✗ Again to see the answer</div>';
    stat();
}

function go(d){
    if(!list.length) return;
    if(!back && d > 0){
        back = true;
        render();
        return;
    }
    pos = (pos + d + list.length) % list.length;
    back = false;
    render();
}

function mark(v){
    if(!list.length) return;
    var realCardIdx = list[pos];
    st[di][realCardIdx] = v;

    if(isMissedMode && v === 'ok'){
        list.splice(pos, 1);
        if(pos >= list.length) pos = 0;
        back = false;
        render();
        return;
    }

    if(!back){
        back = true;
        render();
        return;
    }
    go(1);
}

function flip(){if(list.length){back=!back;render()}}

async function logout() {
    await supabaseClient.auth.signOut();
    localStorage.removeItem('session_token');
    window.location.href = 'index.html';
}

sel.onchange = function(){ di = +sel.value; start(false); };
$('all').onclick = function(){ start(false); };
$('miss').onclick = function(){ start(true); };
$('shuf').onchange = function(){ start(false); };
$('card').onclick = flip; $('flip').onclick = flip; $('prev').onclick = function(){ go(-1); }; $('next').onclick = function(){ go(1); };
$('good').onclick = function(){ mark('ok'); }; $('bad').onclick = function(){ mark('no'); };

// حظر الاختصارات الضارة وتفعيل التنقل بالكيبورد
document.addEventListener('selectstart', function(e) { e.preventDefault(); });
document.addEventListener('contextmenu', event => event.preventDefault());

document.onkeydown = function(e){
    if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
        return false;
    }

    if(e.key === ' ' || e.code === 'Space' || e.key === 'Enter'){
        e.preventDefault();
        flip();
    }
    else if(e.key === 'ArrowRight' || e.code === 'ArrowRight'){
        e.preventDefault();
        go(1);
    }
    else if(e.key === 'ArrowLeft' || e.code === 'ArrowLeft'){
        e.preventDefault();
        go(-1);
    }
    else if(e.key === 'ArrowUp' || e.code === 'ArrowUp'){
        e.preventDefault();
        mark('ok');
    }
    else if(e.key === 'ArrowDown' || e.code === 'ArrowDown'){
        e.preventDefault();
        mark('no');
    }
};
</script>
</body>
</html>
