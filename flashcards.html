<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفلاش كاردس التعليمية</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center; outline: none; }
        
        button { background-color: #3498db; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background-color: #2980b9; }

        .hidden { display: none !important; }
        
        .card { background: #fdfdfd; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-top: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: right; }
        .card-category { font-size: 12px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }
        .card-question { font-size: 18px; color: #2c3e50; margin: 15px 0; font-weight: 600; }
        .card-answer { background: #e8f8f5; color: #16a085; padding: 10px; border-radius: 6px; font-weight: bold; display: none; margin-top: 10px; text-align: center; }
        
        .error-msg { color: #e74c3c; font-weight: bold; margin-top: 10px; }
        .success-msg { color: #27ae60; font-weight: bold; margin-top: 10px; }

        /* ستايل اختيار القسم القائمة المنسدلة */
        .section-selector { margin-bottom: 20px; text-align: right; }
        .section-selector label { display: block; font-size: 14px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
        .custom-select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; font-weight: bold; color: #2c3e50; background: white; outline: none; cursor: pointer; }

        /* صندوق قفل القسم المدفوع */
        .locked-section { background: #fff5f5; border: 2px dashed #feb2b2; border-radius: 10px; padding: 25px; margin-top: 20px; text-align: center; }
        .locked-section h3 { color: #c53030; margin-top: 0; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- شاشة إدخال الكود وتفعيل الحساب -->
        <div id="auth-section">
            <h2>تفعيل اشتراك المنصة</h2>
            <p style="color: #7f8c8d; font-size: 14px;">أدخل كود التفعيل الخاص بك للوصول للمحتوى الكامل</p>
            <input type="text" id="activation-code" placeholder="أدخل كود التفعيل هنا">
            <button onclick="verifyCode()">تفعيل الدخول</button>
            <div id="status-message"></div>
        </div>

        <!-- شاشة عرض الفلاش كاردس والأقسام -->
        <div id="content-section" class="hidden">
            <h2>الكروت التعليمية</h2>
            <p id="welcome-text" class="success-msg"></p>

            <!-- القائمة المنسدلة للاختيار بين المجاني والمدفوع -->
            <div class="section-selector">
                <label for="subject-select">اختر القسم الدراسي:</label>
                <select id="subject-select" class="custom-select" onchange="onSubjectChange()">
                    <!-- قسم مجاني -->
                    <option value="free" data-is-free="true">🔓 القسم المجاني (متاحة للجميع)</option>
                    
                    <!-- أقسام مدفوعة (عليها علامة قفل 🔒) -->
                    <option value="unit1" data-is-free="false">🔒 الوحدة الأولى: التركيب والوظيفة (مدفوع)</option>
                    <option value="unit2" data-is-free="false">🔒 الوحدة الثانية: أجهزة الجسم (مدفوع)</option>
                </select>
            </div>

            <!-- صندوق الحظر لو القسم مدفوع والمستخدم لم يفعل الكود -->
            <div id="locked-box" class="locked-section hidden">
                <h3>🔒 هذا القسم مغلق</h3>
                <p style="color: #718096; font-size: 14px; margin-bottom: 15px;">هذا القسم مخصص للمشتركين فقط. أدخل كود التفعيل لفتحه فوراً.</p>
                <input type="text" id="quick-activation-code" placeholder="أدخل الكود هنا...">
                <button onclick="verifyQuickCode()" style="background-color: #27ae60;">تفعيل هذا القسم</button>
                <div id="quick-status-msg"></div>
            </div>

            <!-- حاوية عرض الكروت -->
            <div id="cards-container"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://rphakvxxjnzzwxzghcld.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_KrRdYi553EtaX_ggzzVHeQ_L_gb6xFf";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let isUserActivated = false; // هل الحساب مفعل بكود صحيح أم لا

        // التحقق الأولي عند فتح الصفحة لو كان مفعل قبل كدة في الجلسة
        window.addEventListener('DOMContentLoaded', () => {
            const savedActivation = localStorage.getItem('is_activated');
            if (savedActivation === 'true') {
                isUserActivated = true;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('content-section').classList.remove('hidden');
                document.getElementById('welcome-text').innerText = 'أهلاً بك! حسابك مَفعل بالكامل.';
                onSubjectChange();
            }
        });

        // التحقق من كود التفعيل الرئيسي
        async function verifyCode() {
            const codeInput = document.getElementById('activation-code').value.trim();
            const messageDiv = document.getElementById('status-message');
            messageDiv.className = '';
            messageDiv.innerText = 'جاري التحقق من الكود...';

            if (!codeInput) {
                messageDiv.className = 'error-msg';
                messageDiv.innerText = 'يرجى إدخال الكود أولاً!';
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('activation_codes')
                    .select('*')
                    .eq('code', codeInput)
                    .single();

                if (error || !data) {
                    messageDiv.className = 'error-msg';
                    messageDiv.innerText = 'كود التفعيل غير صحيح!';
                    return;
                }

                // نجاح التفعيل
                isUserActivated = true;
                localStorage.setItem('is_activated', 'true');

                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('content-section').classList.remove('hidden');
                document.getElementById('welcome-text').innerText = 'تم التفعيل بنجاح! مرحباً بك.';
                onSubjectChange();

            } catch (err) {
                messageDiv.className = 'error-msg';
                messageDiv.innerText = 'حدث خطأ أثناء التواصل مع السيرفر.';
            }
        }

        // تفعيل سريع من داخل صندوق القفل لو اختار قسم مدفوع
        async function verifyQuickCode() {
            const codeInput = document.getElementById('quick-activation-code').value.trim();
            const messageDiv = document.getElementById('quick-status-msg');
            messageDiv.className = '';
            messageDiv.innerText = 'جاري التحقق...';

            if (!codeInput) {
                messageDiv.className = 'error-msg';
                messageDiv.innerText = 'يرجى إدخال الكود!';
                return;
            }

            const { data, error } = await supabaseClient
                .from('activation_codes')
                .select('*')
                .eq('code', codeInput)
                .single();

            if (error || !data) {
                messageDiv.className = 'error-msg';
                messageDiv.innerText = 'الكود غير صحيح!';
            } else {
                isUserActivated = true;
                localStorage.setItem('is_activated', 'true');
                messageDiv.className = 'success-msg';
                messageDiv.innerText = 'تم التفعيل بنجاح!';
                setTimeout(() => {
                    onSubjectChange();
                }, 800);
            }
        }

        // عند تغيير القسم من القائمة المنسدلة
        function onSubjectChange() {
            const select = document.getElementById('subject-select');
            const selectedOption = select.options[select.selectedIndex];
            const isFree = selectedOption.getAttribute('data-is-free') === 'true';

            const lockedBox = document.getElementById('locked-box');
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            // لو القسم مدفوع والحساب لم يُفعل
            if (!isFree && !isUserActivated) {
                lockedBox.classList.remove('hidden');
                return;
            }

            // لو القسم متاح (مجاني أو مفعل)
            lockedBox.classList.add('hidden');

            if (select.value === 'free') {
                // محتوى القسم المجاني
                container.innerHTML = `
                    <div class="card">
                        <div class="card-category">العينة المجانية</div>
                        <div class="card-question">💡 ما هي الوحدة الأساسية لبناء الكائنات الحية؟</div>
                        <button onclick="toggleAnswer(this)" style="background:#2ecc71; width:auto; padding:8px 15px; font-size:14px;">إظهار الإجابة</button>
                        <div class="card-answer">الإجابة: الخلية (Cell)</div>
                    </div>
                `;
            } else if (select.value === 'unit1') {
                // محتوى الوحدة الأولى
                container.innerHTML = `
                    <div class="card">
                        <div class="card-category">الوحدة الأولى</div>
                        <div class="card-question">🧬 ما هو العضو المسؤول عن تصفية الدم في جسم الإنسان؟</div>
                        <button onclick="toggleAnswer(this)" style="background:#2ecc71; width:auto; padding:8px 15px; font-size:14px;">إظهار الإجابة</button>
                        <div class="card-answer">الإجابة: الكلية (Kidney)</div>
                    </div>
                `;
            } else if (select.value === 'unit2') {
                // محتوى الوحدة الثانية
                container.innerHTML = `
                    <div class="card">
                        <div class="card-category">الوحدة الثانية</div>
                        <div class="card-question">🔬 كم عدد حجرات قلب الإنسان الأساسية؟</div>
                        <button onclick="toggleAnswer(this)" style="background:#2ecc71; width:auto; padding:8px 15px; font-size:14px;">إظهار الإجابة</button>
                        <div class="card-answer">الإجابة: 4 حجرات (أذينان وبطينان)</div>
                    </div>
                `;
            }
        }

        // إظهار وإخفاء الإجابة لكل كارت
        function toggleAnswer(btn) {
            const answerDiv = btn.nextElementSibling;
            if (answerDiv.style.display === 'block') {
                answerDiv.style.display = 'none';
                btn.innerText = 'إظهار الإجابة';
            } else {
                answerDiv.style.display = 'block';
                btn.innerText = 'إخفاء الإجابة';
            }
        }
    </script>
</body>
</html>
