<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفلاش كاردس التعليمية</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }

        .hidden { display: none !important; }
        
        .card { background: #fdfdfd; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-top: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: right; }
        .card-category { font-size: 12px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }
        .card-question { font-size: 18px; color: #2c3e50; margin: 15px 0; font-weight: 600; }
        .card-answer { background: #e8f8f5; color: #16a085; padding: 10px; border-radius: 6px; font-weight: bold; display: none; margin-top: 10px; text-align: center; }
        
        .success-msg { color: #27ae60; font-weight: bold; margin-bottom: 15px; }
        
        /* الشريط العلوي للتحكم وتسجيل الخروج */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .btn-logout { background-color: #e74c3c; padding: 8px 15px; font-size: 14px; }
        .btn-logout:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <h2 style="margin:0;">الكروت التعليمية</h2>
            <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
        </div>

        <p id="welcome-text" class="success-msg">مرحباً بك! تم التحميل بنجاح.</p>
        
        <!-- حاوية عرض الكروت -->
        <div id="cards-container">
            <p style="color: #7f8c8d;">جاري تحميل الكروت...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://rphakvxxjnzzwxzghcld.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_KrRdYi553EtaX_ggzzVHeQ_L_gb6xFf";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // عند فتح الصفحة، يتم جلب الكروت مباشرة
        window.addEventListener('DOMContentLoaded', async () => {
            await loadFlashcards();
        });

        async function loadFlashcards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            try {
                // جلب الكروت مرتبة حسب card_order أو بشكل عام
                const { data: flashcards, error } = await supabaseClient
                    .from('flashcards')
                    .select('*')
                    .order('card_order', { ascending: true });

                if (error || !flashcards || flashcards.length === 0) {
                    container.innerHTML = '<p style="color: #e74c3c;">لا توجد كروت متاحة حالياً في قاعدة البيانات.</p>';
                    return;
                }

                // بناء الكروت بالشكل المطلوب
                flashcards.forEach(card => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    cardEl.innerHTML = `
                        <div class="card-category">${card.category || 'عام'}</div>
                        <div class="card-question">${card.question}</div>
                        <button onclick="toggleAnswer(this)" style="background:#2ecc71; width:auto; font-size:14px; padding:8px 15px;">إظهار الإجابة</button>
                        <div class="card-answer">${card.answer}</div>
                    `;
                    container.appendChild(cardEl);
                });

            } catch (err) {
                container.innerHTML = '<p style="color: #e74c3c;">حدث خطأ أثناء جلب البيانات من السيرفر.</p>';
            }
        }

        // إظهار وإخفاء الإجابة لكل كارت
        function toggleAnswer(btn) {
            const answerDiv = btn.nextElementSibling;
            if (answerDiv.style.display === 'block') {
                answerDiv.style.display = 'none';
                btn.innerText = 'إظهار الإجابة';
            } else {
                answerDiv.style.display = 'block';
                btn.innerText = 'إخفاء الإجابة';
            }
        }

        // زر تسجيل الخروج والعودة لصفحة index
        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
